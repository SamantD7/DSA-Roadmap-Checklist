<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0d11;
  --surface: #12151c;
  --surface2: #161a24;
  --border: #1e2330;
  --accent: #4fffb0;
  --accent2: #7b61ff;
  --text: #dde3f0;
  --muted: #5a6280;
  --danger: #ff5c5c;
  --warn: #ffa94d;
  --lc: #ffa116;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  padding: 32px 20px 120px;
}

/* ── HEADER ── */
header { text-align: center; margin-bottom: 24px; }
header h1 {
  font-size: clamp(1.8rem, 5vw, 3.2rem);
  font-weight: 800;
  letter-spacing: -1px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; line-height: 1.1;
}
header p { margin-top: 8px; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; letter-spacing: 1px; }

/* ── PROGRESS BAR ── */
.prog-wrap { max-width: 600px; margin: 16px auto 0; background: var(--border); border-radius: 999px; height: 6px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width 0.4s ease; width: 0%; }
.prog-label { text-align: center; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--muted); }

/* ── TAB SWITCHER ── */
.tab-switcher {
  display: flex;
  max-width: 860px;
  margin: 24px auto 28px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 4px;
  gap: 4px;
}
.tab-btn {
  flex: 1;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.76rem;
  font-weight: 700;
  letter-spacing: 0.5px;
  padding: 8px 16px;
  border: none;
  border-radius: 7px;
  cursor: pointer;
  transition: all 0.18s;
  background: transparent;
  color: var(--muted);
}
.tab-btn:hover { color: var(--text); background: rgba(255,255,255,0.04); }
.tab-btn.active {
  background: linear-gradient(135deg, rgba(79,255,176,0.15), rgba(123,97,255,0.15));
  color: var(--accent);
  border: 1px solid rgba(79,255,176,0.2);
}

/* ── TAB PANELS ── */
.tab-panel { display: none; }
.tab-panel.active { display: block; }

/* ── DEADLINE BANNER ── */
.deadline-banner {
  max-width: 860px; margin: 0 auto 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 22px;
}
.deadline-banner.has-date { border-color: rgba(79,255,176,0.2); }
.deadline-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.deadline-label { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.deadline-input {
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem; padding: 6px 10px; outline: none; transition: border-color 0.15s;
}
.deadline-input:focus { border-color: var(--accent); }
.dl-clear { background: transparent; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer; font-family: 'JetBrains Mono', monospace; padding: 4px 6px; border-radius: 4px; }
.dl-clear:hover { color: var(--danger); }

.pacing-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px; margin-top: 16px;
}
.pacing-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
}
.pacing-card .pc-val {
  font-size: 1.6rem; font-weight: 800; line-height: 1;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.pacing-card .pc-val.warn { background: none; -webkit-text-fill-color: var(--warn); color: var(--warn); }
.pacing-card .pc-val.danger { background: none; -webkit-text-fill-color: var(--danger); color: var(--danger); }
.pacing-card .pc-lbl { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.5px; }
.week-bar-wrap { margin-top: 10px; background: var(--border); border-radius: 999px; height: 4px; overflow: hidden; }
.week-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s; }

/* ── CONTAINER ── */
.container { max-width: 860px; margin: 0 auto; }

/* ── PHASE ── */
.phase { margin-bottom: 40px; }
.phase-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.phase-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 0.67rem; font-weight: 700;
  letter-spacing: 2px; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; flex-shrink: 0;
}
.phase-title { font-size: 1.15rem; font-weight: 800; flex: 1; }
.btn-add-topic {
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
  color: var(--accent); background: rgba(79,255,176,0.07);
  border: 1px solid rgba(79,255,176,0.2); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn-add-topic:hover { background: rgba(79,255,176,0.15); border-color: var(--accent); }

/* ── TOPIC ── */
.topic { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s; }
.topic:hover { border-color: #252c40; }
.topic-header { display: flex; align-items: center; gap: 10px; padding: 13px 15px; cursor: pointer; user-select: none; }
.topic-header:hover { background: rgba(255,255,255,0.015); }
.topic-num { font-family: 'JetBrains Mono', monospace; font-size: 0.67rem; color: var(--muted); width: 22px; flex-shrink: 0; }
.topic-checkbox { width: 17px; height: 17px; border: 2px solid var(--muted); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; cursor: pointer; }
.topic-checkbox.checked { background: var(--accent); border-color: var(--accent); }
.topic-checkbox.checked::after { content: '✓'; font-size: 10px; color: #000; font-weight: 700; }
.topic-checkbox.partial { background: rgba(79,255,176,0.18); border-color: var(--accent); }
.topic-checkbox.partial::after { content: '–'; font-size: 13px; color: var(--accent); font-weight: 700; }
.topic-name { font-size: 0.92rem; font-weight: 700; flex: 1; min-width: 0; }
.topic-name.done { text-decoration: line-through; color: var(--muted); }
.topic-progress { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
.topic-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.icon-btn { width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.88rem; transition: all 0.15s; color: var(--muted); }
.icon-btn:hover { background: rgba(255,255,255,0.06); }
.icon-btn.add-sub { color: var(--accent); font-size: 1rem; }
.icon-btn.add-sub:hover { background: rgba(79,255,176,0.12); }
.icon-btn.del:hover { background: rgba(255,92,92,0.15); color: var(--danger); }
.toggle-icon { font-size: 0.7rem; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
.toggle-icon.open { transform: rotate(90deg); }

/* ── SUBTOPICS PANEL ── */
.subtopics { display: none; border-top: 1px solid var(--border); background: rgba(0,0,0,0.12); }
.subtopics.open { display: block; }

/* ── SUBTOPIC ROW ── */
.subtopic-wrap { border-bottom: 1px solid rgba(30,35,48,0.5); }
.subtopic-wrap:last-child { border-bottom: none; }

.subtopic-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 15px 8px 50px;
}
.sub-left { display: flex; align-items: flex-start; gap: 8px; flex: 1; cursor: pointer; }
.sub-left:hover .sub-cb { border-color: var(--accent); }
.sub-cb { width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; flex-shrink: 0; margin-top: 3px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.sub-cb.checked { background: var(--accent); border-color: var(--accent); }
.sub-cb.checked::after { content: '✓'; font-size: 8px; color: #000; font-weight: 700; }
.sub-label { font-size: 0.83rem; color: var(--text); line-height: 1.5; }
.sub-label strong { color: var(--accent); font-weight: 700; }
.sub-label.done { text-decoration: line-through; color: var(--muted); }
.sub-label.done strong { color: var(--muted); }

.sub-actions { display: flex; align-items: center; gap: 3px; flex-shrink: 0; margin-top: 1px; }
.sub-icon { width: 22px; height: 22px; border-radius: 5px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; color: var(--muted); transition: all 0.15s; opacity: 0; }
.subtopic-wrap:hover .sub-icon { opacity: 1; }
.sub-icon:hover { background: rgba(255,255,255,0.07); color: var(--text); }
.sub-icon.del:hover { background: rgba(255,92,92,0.15); color: var(--danger); }
.sub-icon.note-btn { font-size: 0.7rem; }
.sub-icon.note-btn.active { opacity: 1; color: var(--accent2); }

/* ── NOTES + LC PANEL ── */
.sub-meta {
  display: none;
  padding: 0 15px 10px 50px;
  gap: 8px;
  flex-direction: column;
  background: rgba(0,0,0,0.1);
}
.sub-meta.open { display: flex; }

.meta-row { display: flex; gap: 8px; align-items: flex-start; }

.meta-input {
  flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; padding: 7px 10px; outline: none; transition: border-color 0.15s;
  resize: none;
}
.meta-input:focus { border-color: var(--accent2); }
.meta-input::placeholder { color: var(--muted); }

.lc-input-wrap { display: flex; gap: 6px; align-items: center; flex: 1; }
.lc-tag {
  font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
  color: var(--lc); background: rgba(255,161,22,0.1);
  border: 1px solid rgba(255,161,22,0.25); border-radius: 4px;
  padding: 3px 7px; white-space: nowrap; flex-shrink: 0;
}

/* LC chips */
.lc-chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 0 2px; }
.lc-chip {
  display: flex; align-items: center; gap: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
  color: var(--lc); background: rgba(255,161,22,0.08);
  border: 1px solid rgba(255,161,22,0.2); border-radius: 5px;
  padding: 3px 7px; text-decoration: none; cursor: pointer;
  transition: all 0.12s;
}
.lc-chip:hover { background: rgba(255,161,22,0.18); border-color: var(--lc); }
.lc-chip .chip-x { color: var(--muted); font-size: 0.6rem; }
.lc-chip .chip-x:hover { color: var(--danger); }

.note-saved { font-family: 'JetBrains Mono', monospace; font-size: 0.64rem; color: var(--muted); font-style: italic; }
.note-preview { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); padding: 3px 0 4px; line-height: 1.4; white-space: pre-wrap; }

/* ── ADD FORMS ── */
.add-sub-row { display: flex; gap: 7px; padding: 10px 15px 8px 50px; align-items: center; border-top: 1px solid var(--border); background: rgba(0,0,0,0.1); }
.add-topic-form { background: var(--surface); border: 1px dashed rgba(79,255,176,0.3); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }

.form-input {
  flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem; padding: 7px 11px; outline: none; transition: border-color 0.15s;
}
.form-input.topic-inp { font-family: 'Syne', sans-serif; font-size: 0.88rem; font-weight: 700; }
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--muted); font-weight: 400; font-family: 'JetBrains Mono', monospace; }

.form-btn { background: rgba(79,255,176,0.1); border: 1px solid rgba(79,255,176,0.3); border-radius: 7px; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; padding: 7px 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.form-btn:hover { background: rgba(79,255,176,0.2); }
.form-btn.cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.form-btn.cancel:hover { border-color: var(--danger); color: var(--danger); background: transparent; }

/* ── BOTTOM ── */
.bottom-actions { display: flex; justify-content: center; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.bottom-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; padding: 8px 18px; border-radius: 7px; cursor: pointer; transition: all 0.15s; }
.bottom-btn:hover { border-color: var(--danger); color: var(--danger); }

/* ── MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #181c28; border: 1px solid var(--border); border-radius: 14px; padding: 26px 22px; max-width: 400px; width: 90%; }
.modal h3 { font-size: 0.92rem; margin-bottom: 18px; line-height: 1.5; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal-actions button { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; padding: 7px 15px; border-radius: 7px; cursor: pointer; transition: all 0.15s; }
.modal-confirm { background: rgba(255,92,92,0.12); border: 1px solid rgba(255,92,92,0.4); color: var(--danger); }
.modal-confirm:hover { background: rgba(255,92,92,0.22); }
.modal-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.modal-cancel:hover { color: var(--text); border-color: var(--muted); }

/* ── GITHUB BADGE ── */
.gh-badge {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #12151c;
  border: 1px solid #2a3050;
  border-radius: 10px;
  padding: 9px 14px;
  text-decoration: none;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  z-index: 50;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.gh-badge:hover {
  border-color: var(--accent);
  background: #1a1f2e;
  transform: translateY(-2px);
}
.gh-badge svg { flex-shrink: 0; }
.gh-badge .gh-name { color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }

/* ══════════════════════════════════════════════════
   GUIDE TAB STYLES
══════════════════════════════════════════════════ */
.guide-container { max-width: 860px; margin: 0 auto; }

.guide-search-bar {
  display: flex; gap: 8px; margin-bottom: 16px; align-items: center;
}
.guide-search-input {
  flex: 1; padding: 10px 14px;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--surface);
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem;
  outline: none;
  transition: border-color 0.15s;
}
.guide-search-input:focus { border-color: var(--accent); }
.guide-search-input::placeholder { color: var(--muted); }

.guide-phase-filter {
  display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px;
}
.gpf-btn {
  padding: 5px 13px; border-radius: 999px;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; cursor: pointer; transition: all 0.15s;
}
.gpf-btn:hover { color: var(--text); border-color: var(--muted); }
.gpf-btn.active {
  background: rgba(79,255,176,0.1);
  color: var(--accent);
  border-color: rgba(79,255,176,0.3);
}

.guide-result-count {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.68rem; color: var(--muted); margin-bottom: 14px;
}

.guide-topic-block { margin-bottom: 32px; }

.guide-topic-title {
  font-size: 1rem; font-weight: 800;
  display: flex; align-items: center; gap: 10px;
  margin-bottom: 4px;
}
.guide-phase-pill {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; padding: 3px 9px;
  border-radius: 999px; font-weight: 400;
}
.guide-topic-desc {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.73rem; color: var(--muted);
  margin-bottom: 12px; line-height: 1.6;
}

.guide-sub-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 13px 15px;
  margin-bottom: 8px;
  transition: border-color 0.15s;
}
.guide-sub-card:hover { border-color: #252c40; }

.guide-sub-name {
  font-size: 0.88rem; font-weight: 700;
  color: var(--accent); margin-bottom: 6px;
}

.guide-identify-label {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.62rem; color: var(--muted);
  text-transform: uppercase; letter-spacing: 1px;
  margin-bottom: 3px; margin-top: 8px;
}
.guide-identify-label:first-of-type { margin-top: 0; }

.guide-identify-text {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.74rem; color: var(--text);
  line-height: 1.6; margin-bottom: 4px;
}

.guide-kw-wrap { display: flex; flex-wrap: wrap; gap: 5px; margin-bottom: 4px; }
.guide-kw-tag {
  display: inline-block;
  background: rgba(123,97,255,0.1);
  border: 1px solid rgba(123,97,255,0.25);
  border-radius: 5px;
  padding: 2px 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.65rem; color: var(--accent2);
}

.guide-lc-chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 4px; }
.guide-lc-chip {
  font-family: 'JetBrains Mono', monospace; font-size: 0.66rem;
  padding: 3px 9px; border-radius: 5px;
  text-decoration: none; cursor: pointer;
  transition: all 0.12s;
  border: 1px solid;
}
.guide-lc-chip.easy {
  color: #6dbe45; background: rgba(109,190,69,0.08);
  border-color: rgba(109,190,69,0.3);
}
.guide-lc-chip.easy:hover { background: rgba(109,190,69,0.18); }
.guide-lc-chip.med {
  color: var(--lc); background: rgba(255,161,22,0.08);
  border-color: rgba(255,161,22,0.3);
}
.guide-lc-chip.med:hover { background: rgba(255,161,22,0.18); }
.guide-lc-chip.hard {
  color: #ff5c5c; background: rgba(255,92,92,0.08);
  border-color: rgba(255,92,92,0.3);
}
.guide-lc-chip.hard:hover { background: rgba(255,92,92,0.18); }

.guide-divider {
  border: none; border-top: 1px solid var(--border);
  margin: 24px 0;
}

.guide-no-results {
  text-align: center; color: var(--muted);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.82rem; padding: 4rem 0;
}

  .topic-num { display: none; }
  .subtopic-row { padding-left: 32px; }
  .sub-meta { padding-left: 32px; }

  .gh-badge { bottom: 16px; right: 16px; padding: 7px 11px; }
}

<script>
// ═══════════════════════════════════════════════════
// TAB SWITCHING
// ═══════════════════════════════════════════════════
function switchTab(tab) {
  document.getElementById('panelRoadmap').classList.toggle('active', tab === 'roadmap');
  document.getElementById('panelGuide').classList.toggle('active', tab === 'guide');
  document.getElementById('tabRoadmap').classList.toggle('active', tab === 'roadmap');
  document.getElementById('tabGuide').classList.toggle('active', tab === 'guide');
  if (tab === 'guide' && !guideInitialized) { initGuide(); guideInitialized = true; }
}
let guideInitialized = false;

// ═══════════════════════════════════════════════════
// DEFAULT DATA (ROADMAP)
// ═══════════════════════════════════════════════════
const DEFAULT_DATA = [
  { phase:"PHASE 1", title:"Foundations", color:"#ff6b6b", topics:[
    { id:"t1", name:"Arrays & Strings", subs:["Static vs Dynamic Arrays — fixed-size vs resizable arrays, memory layout, cache efficiency","In-place operations — modifying array without extra space (reversal, rotation)","Kadane's Algorithm — max subarray sum in O(n) using local/global max tracking","Dutch National Flag — 3-way partition for 0s, 1s, 2s in one pass","Array Rotation — left/right rotation using reversal trick in O(n)","String immutability — why strings behave differently from arrays in Java/Python","Character frequency — using arrays of size 26 instead of hashmaps for lowercase strings","Anagram & palindrome checks — sorting vs frequency counting approaches","String matching (naive) — brute force O(n×m) before learning KMP later"]},
    { id:"t2", name:"Hashing", subs:["HashMap internals — hash function, buckets, chaining, load factor, rehashing","Collision handling — chaining vs open addressing","HashSet usage — O(1) lookup for existence checks","Frequency maps — counting occurrences of elements","Index mapping — storing first/last seen index of elements","Custom hashing — hashing pairs, tuples, strings as keys"]},
    { id:"t3", name:"Two Pointers", subs:["Opposite end pointers — start and end moving inward (pair sum, container with most water)","Same direction pointers — slow/fast pointers for in-place operations","Partitioning — Dutch flag, segregation problems","Three sum / k-sum — fixing one element, two-pointer for the rest"]},
    { id:"t4", name:"Sliding Window", subs:["Fixed size window — max/min/sum in window of size k","Variable size window — expand/shrink based on condition (longest substring without repeat)","Window with hashmaps — tracking character/element counts inside window","At most k / exactly k trick — converting exact count problems to at-most"]},
    { id:"t5", name:"Prefix Sum & Difference Arrays", subs:["1D prefix sum — range sum queries in O(1) after O(n) build","2D prefix sum — submatrix sum queries in O(1)","Difference array — range update in O(1), reconstruct in O(n)","Prefix XOR — subarray XOR queries","Count of subarrays with given sum — prefix sum + hashmap trick"]},
    { id:"t6", name:"Bit Manipulation", subs:["Binary representation — how integers are stored in binary, signed vs unsigned","Basic bitwise operators — AND, OR, XOR, NOT and their truth tables","Left & right shift — multiplying/dividing by powers of 2 using shifts","Set, clear, toggle a bit — standard mask operations on individual bits","Check if bit is set — using n & (1 << i) to read a specific bit position","Power of 2 check — n & (n-1) == 0 trick to check in O(1)","Count set bits (Hamming weight) — Brian Kernighan's algorithm, built-in __builtin_popcount","XOR properties — a^a=0, a^0=a, used for finding unique elements","Bit masking for subsets — representing and iterating all subsets of a set using bits","Two's complement — how negative numbers work in binary, why -n = ~n + 1"]},
    { id:"t7", name:"Sorting", subs:["Bubble, Selection, Insertion — O(n²) sorts, when they're useful (nearly sorted input)","Merge Sort — divide & conquer, stable, O(n log n), basis for inversion count","Quick Sort — pivot partitioning, average O(n log n), worst O(n²), in-place","Counting Sort — O(n+k) for bounded integers","Radix Sort — sort digit by digit for large integers","Custom comparators — sorting by second element, structs, lambda functions","Inversion count — modified merge sort to count pairs where arr[i] > arr[j], i < j"]},
    { id:"t8", name:"Binary Search", subs:["Classic binary search — searching in sorted array, lo/hi/mid logic","Lower bound / Upper bound — first occurrence, last occurrence, count","Binary search on answer — when answer has monotone property (search space is a range, not array)","Rotated sorted array — finding pivot, searching in rotated arrays","Binary search on floats — for problems needing precision answers","2D binary search — searching in row-wise/col-wise sorted matrix"]},
    { id:"t8_ls", name:"Line Sweep", subs:["Sweep line concept — imaginary vertical line moves left to right across events, processing them in sorted order","Event-based sorting — convert geometry/interval problems into discrete events sorted by x-coordinate or value","Interval overlap detection — use sweep to find if any two intervals overlap in O(n log n)","Meeting rooms pattern — count maximum simultaneous overlapping intervals using start/end events","Area of union of rectangles — sweep vertical line, track active y-intervals to compute covered area","Skyline problem — process building edges as events, use max-heap or multiset to track current height","Coordinate compression — compress sparse coordinates to dense indices before sweeping","Difference array + sweep — apply range updates as +1/-1 events, sweep to reconstruct values"]}
  ]},
  { phase:"PHASE 2", title:"Core Data Structures", color:"#ffa94d", topics:[
    { id:"t9", name:"Linked List", subs:["Singly linked list — node structure, traversal, insertion, deletion","Doubly linked list — prev pointer, O(1) deletion given node reference","Circular linked list — no null tail, use in round-robin scheduling","Floyd's Cycle Detection — slow/fast pointer to detect and find cycle start","Reversal — iterative and recursive reversal of full/partial list","Merge two sorted lists — pointer manipulation without extra space","Dummy node trick — simplifies edge cases at head during insertion/deletion"]},
    { id:"t10", name:"Stacks", subs:["Stack using array/linked list — push, pop, peek in O(1)","Monotonic stack — maintaining increasing/decreasing order for next greater/smaller element","Stack for expression evaluation — infix to postfix, balanced parentheses","Min stack — O(1) getMin with auxiliary stack or encoding trick","Histogram problems — largest rectangle using stack"]},
    { id:"t11", name:"Queues & Deques", subs:["Queue using array/linked list — FIFO, circular queue","Queue using two stacks — amortized O(1) enqueue/dequeue","Deque (double-ended queue) — insert/delete from both ends","Sliding window maximum — monotonic deque to get max in O(1) per window","BFS queue usage — level-order traversal and shortest path"]},
    { id:"t12", name:"Heaps & Priority Queues", subs:["Binary heap structure — complete binary tree stored in array, parent-child index formula","Min-heap / Max-heap — heapify up and down operations","Heap sort — build heap O(n), extract O(n log n)","K-th largest/smallest — min-heap of size k trick","Merge k sorted lists — min-heap with (value, list_index) tuples","Top-K frequent elements — frequency map + heap","Median of stream — two heaps (max-heap for lower half, min-heap for upper half)"]},
    { id:"t13", name:"Recursion & Backtracking", subs:["Recursion fundamentals — base case, recursive case, call stack visualization","Tree of recursion — understanding branching factor and depth","Backtracking template — choose → explore → unchoose pattern","Subsets & permutations — generating all combinations with/without repetition","Constraint satisfaction — N-Queens, Sudoku, Word Search","Pruning — cutting branches early to reduce time"]},
    { id:"t14", name:"Trees", subs:["Binary tree representation — node structure, left/right child","Tree traversals — inorder, preorder, postorder (recursive + iterative)","Level-order traversal — BFS using queue, level-by-level processing","BST properties — left < root < right, inorder gives sorted order","BST operations — insert, delete (3 cases), search in O(h)","Height, diameter, balance — recursive definitions and calculations","LCA (Lowest Common Ancestor) — brute path comparison vs single-pass recursion","Views of a tree — left view, right view, top view, bottom view","Morris Traversal — O(1) space inorder traversal using thread pointers"]}
  ]},
  { phase:"PHASE 3", title:"Intermediate Algorithms", color:"#4dabf7", topics:[
    { id:"t15", name:"Greedy", subs:["Greedy choice property — locally optimal choice leads to global optimum","Activity selection / Interval scheduling — sort by end time, pick non-overlapping","Interval merging — sort by start, merge overlapping intervals","Jump Game — track farthest reachable index","Huffman encoding — min-heap based variable-length coding","Fractional Knapsack — sort by value/weight ratio"]},
    { id:"t16", name:"Divide & Conquer", subs:["Merge sort pattern — split → solve → merge","Quick select — find k-th smallest in O(n) average using partitioning","Power function — fast exponentiation in O(log n)","Closest pair of points — geometric D&C problem","Matrix exponentiation — repeated matrix multiplication in O(log n) for Fibonacci etc."]},
    { id:"t17", name:"Dynamic Programming — 1D", subs:["Memoization vs Tabulation — top-down vs bottom-up approaches","State definition — what dp[i] represents is the entire problem","Fibonacci pattern — dp[i] = dp[i-1] + dp[i-2] family","House robber pattern — non-adjacent selection","Coin change — minimum coins, number of ways","Climbing stairs variations — jump game, frog jump"]},
    { id:"t18", name:"Dynamic Programming — 2D / Grid", subs:["Grid paths — count paths from top-left to bottom-right with obstacles","Minimum path sum — dp[i][j] = min(dp[i-1][j], dp[i][j-1]) + grid[i][j]","0/1 Knapsack — include/exclude item, dp[i][w] table","Subset sum — boolean dp table","Unbounded Knapsack — items can be reused (coin change, rod cutting)"]},
    { id:"t19", name:"DP on Strings", subs:["Longest Common Subsequence (LCS) — 2D dp, basis for many string problems","Longest Common Substring — LCS variant with reset on mismatch","Edit Distance — min insert/delete/replace to convert one string to another","Palindrome DP — longest palindromic subsequence/substring","String matching DP — wildcard matching, regex matching"]}
  ]},
  { phase:"PHASE 4", title:"Graphs", color:"#69db7c", topics:[
    { id:"t20", name:"Graph Representation & Traversal", subs:["Adjacency matrix vs list — space/time tradeoffs","BFS — queue-based, finds shortest path in unweighted graph","DFS — stack/recursion-based, finds connected components, paths","Flood fill — DFS/BFS on 2D grid (number of islands pattern)","Bipartite check — 2-coloring using BFS"]},
    { id:"t21", name:"Topological Sort", subs:["Kahn's algorithm — BFS-based, use indegree array + queue","DFS-based topo sort — postorder DFS, push to stack on finish","Cycle detection in directed graph — topo sort fails if cycle exists (Kahn's won't process all nodes)","Course schedule pattern — prerequisite problems map to topo sort"]},
    { id:"t22", name:"Shortest Path", subs:["Dijkstra — min-heap + relaxation, O((V+E) log V), only non-negative weights","Bellman-Ford — relax all edges V-1 times, detects negative cycles, O(VE)","Floyd-Warshall — all-pairs shortest path, O(V³) DP","0-1 BFS — deque-based BFS when edge weights are only 0 or 1","Multi-source BFS — start BFS from multiple sources simultaneously (walls/gates)"]},
    { id:"t23", name:"Union-Find (DSU)", subs:["Union by rank — attach smaller tree under larger to keep height low","Path compression — flatten tree during find for near O(1) amortized","Cycle detection in undirected graph — if both nodes same component before union → cycle","Connected components — count distinct roots after all unions","Dynamic connectivity — grouping problems (accounts merge, similar strings)"]},
    { id:"t24", name:"Minimum Spanning Tree", subs:["Kruskal's — sort edges by weight, union-find to avoid cycles","Prim's — min-heap, greedily add minimum edge from visited set","Cut property — minimum edge crossing a cut must be in MST (correctness proof)"]},
    { id:"t25", name:"Advanced Graph", subs:["Bridges & Articulation Points — Tarjan's DFS with discovery/low time","Strongly Connected Components — Kosaraju's or Tarjan's SCC","Euler path/circuit — Hierholzer's algorithm, all edges traversed once"]}
  ]},
  { phase:"PHASE 5", title:"Advanced", color:"#da77f2", topics:[
    { id:"t26", name:"Tries", subs:["Trie node structure — children array of size 26, isEnd flag","Insert & Search — character by character traversal","Prefix search (startsWith) — autocomplete pattern","Word search in grid — DFS + Trie to prune branches early","XOR Trie — binary trie to find max XOR pair in array"]},

    { id:"t28", name:"Advanced DP", subs:["Bitmask DP — state includes a bitmask representing subset (TSP, assignment)","Digit DP — count numbers with property in range [L, R], digit by digit","DP on trees — rerooting technique, subtree DP","SOS DP (Sum over Subsets) — iterate over all subsets of a mask efficiently"]},
    { id:"t29", name:"String Algorithms", subs:["KMP — failure function to avoid redundant comparisons, O(n+m)","Z-algorithm — Z-array gives longest prefix match at every position, O(n)","Rabin-Karp — rolling hash for pattern matching, O(n+m) average","Manacher's Algorithm — longest palindromic substring in O(n)","Suffix Arrays — sorted suffixes for advanced string queries"]},
    { id:"t30", name:"Math & Number Theory", subs:["GCD & LCM — Euclidean algorithm, LCM = a×b/GCD","Sieve of Eratosthenes — all primes up to N in O(n log log n)","Modular arithmetic — (a+b) % m, (a×b) % m, Fermat's little theorem","Modular inverse — for division under modulo","Fast exponentiation — binary exponentiation in O(log n)","Combinatorics — nCr with Pascal's triangle or modular inverse"]}

// ═══════════════════════════════════════════════════
// PERSISTENCE
// ═══════════════════════════════════════════════════
const K = { data:'dsa_data_v4', chk:'dsa_chk_v4', open:'dsa_open_v4', meta:'dsa_meta_v4', dl:'dsa_deadline_v4' };
function ps(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch{} }
function ld(key,def){ try{ const r=localStorage.getItem(key); return r?JSON.parse(r):def; }catch{ return def; } }

let appData  = ld(K.data, JSON.parse(JSON.stringify(DEFAULT_DATA)));
let checks   = ld(K.chk,  {});
let openMap  = ld(K.open, {});
let metaMap  = ld(K.meta, {});
let deadline = ld(K.dl,   null);

let addSubOpen=null, addTopicPhase=null, noteOpen={};
let idSeq=Date.now();
function genId(){ return 'u'+(++idSeq); }

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function subKey(tid,i){ return tid+':'+i; }
function metaKey(tid,i){ return tid+'__'+i; }

function findTopic(tid){
  for(const ph of appData){ const t=ph.topics.find(x=>x.id===tid); if(t) return t; }
  return null;
}

function getMeta(tid,i){
  const k=metaKey(tid,i);
  if(!metaMap[k]) metaMap[k]={note:'',lc:[]};
  return metaMap[k];
}

function formatSub(text){
  const d=text.indexOf(' — ');
  if(d===-1) return esc(text);
  return `<strong>${esc(text.slice(0,d))}</strong> — ${esc(text.slice(d+3))}`;
}

function countSubsTotal(){
  let t=0; for(const ph of appData) for(const tp of ph.topics) t+=tp.subs.length; return t;
}
function countSubsDone(){
  let d=0;
  for(const ph of appData) for(const tp of ph.topics) tp.subs.forEach((_,i)=>{ if(isDone(tp.id,i)) d++; });
  return d;
}

// ═══════════════════════════════════════════════════
// DEADLINE + PACING
// ═══════════════════════════════════════════════════
function setDeadline(val){
  deadline = val || null;
  ps(K.dl, deadline);
  renderDeadline();
}
function clearDeadline(){
  deadline=null; ps(K.dl,null);
  document.getElementById('deadlineInput').value='';
  renderDeadline();
}

function renderDeadline(){
  const banner  = document.getElementById('deadlineBanner');
  const grid    = document.getElementById('pacingGrid');
  const dlClear = document.getElementById('dlClear');
  const dlInput = document.getElementById('deadlineInput');

  if(deadline) dlInput.value = deadline;

  if(!deadline){
    banner.classList.remove('has-date');
    grid.style.display='none';
    dlClear.style.display='none';
    return;
  }

  banner.classList.add('has-date');
  dlClear.style.display='inline-block';

  const today   = new Date(); today.setHours(0,0,0,0);
  const target  = new Date(deadline); target.setHours(0,0,0,0);
  const msDay   = 86400000;
  const daysLeft= Math.ceil((target-today)/msDay);
  const weeksLeft=Math.max(0,(daysLeft/7));

  const totalSubs = countSubsTotal();
  const doneSubs  = countSubsDone();
  const remaining = totalSubs - doneSubs;
  const subsPerWeek = weeksLeft > 0 ? (remaining/weeksLeft).toFixed(1) : '∞';
  const subsPerDay  = daysLeft  > 0 ? (remaining/daysLeft).toFixed(1)  : '∞';

  const pct = totalSubs ? Math.round(doneSubs/totalSubs*100) : 0;
  const urgency = daysLeft < 14 ? 'danger' : daysLeft < 30 ? 'warn' : '';

  grid.style.display='grid';
  grid.innerHTML = `
    <div class="pacing-card">
      <div class="pc-val ${urgency}">${daysLeft<0?'0':daysLeft}</div>
      <div class="pc-lbl">days remaining</div>
    </div>
    <div class="pacing-card">
      <div class="pc-val">${remaining}</div>
      <div class="pc-lbl">subtopics left</div>
    </div>
    <div class="pacing-card">
      <div class="pc-val ${parseFloat(subsPerWeek)>10?'warn':''}">${subsPerWeek}</div>
      <div class="pc-lbl">subtopics / week needed</div>
    </div>
    <div class="pacing-card">
      <div class="pc-val ${parseFloat(subsPerDay)>3?'warn':''}">${subsPerDay}</div>
      <div class="pc-lbl">subtopics / day needed</div>
    </div>
    <div class="pacing-card" style="grid-column:1/-1">
      <div class="pc-lbl" style="margin-bottom:6px">Overall Progress — ${pct}% complete</div>
      <div class="week-bar-wrap">
        <div class="week-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════
// CHECKS
// ═══════════════════════════════════════════════════
function isDone(tid,i){ return !!checks[subKey(tid,i)]; }

function toggleSub(tid,i){
  checks[subKey(tid,i)]=!checks[subKey(tid,i)];
  ps(K.chk,checks); render();
}
function toggleTopicBulk(tid,n,e){
  e.stopPropagation();
  const t=findTopic(tid); if(!t) return;
  const all=t.subs.every((_,i)=>isDone(tid,i));
  t.subs.forEach((_,i)=>{ checks[subKey(tid,i)]=!all; });
  ps(K.chk,checks); render();
}

// ═══════════════════════════════════════════════════
// OPEN/CLOSE
// ═══════════════════════════════════════════════════
function toggleOpen(tid){
  openMap[tid]=!openMap[tid];
  ps(K.open,openMap); render();
}

// ═══════════════════════════════════════════════════
// NOTES & LC
// ═══════════════════════════════════════════════════
function toggleNote(tid,i,e){
  e.stopPropagation();
  const k=tid+'_'+i;
  noteOpen[k]=!noteOpen[k];
  render();
  if(noteOpen[k]){
    setTimeout(()=>{ const el=document.getElementById('note_'+tid+'_'+i); if(el) el.focus(); },40);
  }
}

function saveNote(tid,i){
  const el=document.getElementById('note_'+tid+'_'+i);
  if(!el) return;
  getMeta(tid,i).note=el.value;
  ps(K.meta,metaMap);
  const prev=document.getElementById('noteprev_'+tid+'_'+i);
  if(prev) prev.textContent=el.value;
}

function addLC(tid,i){
  const el=document.getElementById('lcinput_'+tid+'_'+i);
  if(!el) return;
  const raw=el.value.trim();
  if(!raw) return;
  const num = raw.match(/(\d{1,5})/);
  if(!num){ el.value=''; return; }
  const id=num[1];
  const m=getMeta(tid,i);
  if(!m.lc.includes(id)) m.lc.push(id);
  ps(K.meta,metaMap);
  el.value='';
  render();
}

function removeLC(tid,i,lcid,e){
  e.stopPropagation();
  const m=getMeta(tid,i);
  m.lc=m.lc.filter(x=>x!==lcid);
  ps(K.meta,metaMap);
  render();
}

// ═══════════════════════════════════════════════════
// ADD / REMOVE TOPIC
// ═══════════════════════════════════════════════════
function showAddTopic(phIdx,e){
  e.stopPropagation(); addTopicPhase=phIdx; addSubOpen=null;
  render();
  setTimeout(()=>{ const el=document.getElementById('newTopicInput'); if(el) el.focus(); },40);
}
function cancelAddTopic(){ addTopicPhase=null; render(); }
function confirmAddTopic(){
  const el=document.getElementById('newTopicInput');
  const name=el?el.value.trim():'';
  if(!name){ if(el) el.focus(); return; }
  const id=genId();
  appData[addTopicPhase].topics.push({id,name,subs:[]});
  openMap[id]=true; addTopicPhase=null;
  ps(K.data,appData); ps(K.open,openMap); render();
}
function deleteTopic(tid,tname){
  confirm2(`Delete topic "${tname}"? All subtopics, notes, and progress will be lost.`, ()=>{
    for(const ph of appData){
      const idx=ph.topics.findIndex(t=>t.id===tid);
      if(idx!==-1){
        const t=ph.topics[idx];
        t.subs.forEach((_,i)=>{ delete checks[subKey(tid,i)]; delete metaMap[metaKey(tid,i)]; });
        ph.topics.splice(idx,1); break;
      }
    }
    ps(K.data,appData); ps(K.chk,checks); ps(K.meta,metaMap); render();
  });
}

// ═══════════════════════════════════════════════════
// ADD / REMOVE SUBTOPIC
// ═══════════════════════════════════════════════════
function showAddSub(tid,e){
  e.stopPropagation(); addSubOpen=tid; addTopicPhase=null;
  openMap[tid]=true; ps(K.open,openMap); render();
  setTimeout(()=>{ const el=document.getElementById('nsi_'+tid); if(el) el.focus(); },40);
}
function cancelAddSub(){ addSubOpen=null; render(); }
function confirmAddSub(tid){
  const el=document.getElementById('nsi_'+tid);
  const text=el?el.value.trim():'';
  if(!text){ if(el) el.focus(); return; }
  const t=findTopic(tid); if(!t) return;
  t.subs.push(text); addSubOpen=null;
  ps(K.data,appData); render();
}
function deleteSub(tid,idx,raw){
  const label=raw.length>55?raw.slice(0,55)+'…':raw;
  confirm2(`Remove subtopic: "${label}"?`, ()=>{
    const t=findTopic(tid); if(!t) return;
    for(let i=idx;i<t.subs.length-1;i++){
      checks[subKey(tid,i)]=checks[subKey(tid,i+1)];
      metaMap[metaKey(tid,i)]=metaMap[metaKey(tid,i+1)];
    }
    delete checks[subKey(tid,t.subs.length-1)];
    delete metaMap[metaKey(tid,t.subs.length-1)];
    t.subs.splice(idx,1);
    ps(K.data,appData); ps(K.chk,checks); ps(K.meta,metaMap); render();
  });
}

function confirm2(msg,cb){
  document.getElementById('modalMsg').textContent=msg;
  document.getElementById('modalOverlay').classList.add('open');
  document.getElementById('modalConfirmBtn').onclick=()=>{ closeModal(); cb(); };
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('open'); }

// RESET
// ═══════════════════════════════════════════════════
function resetProgress(){
  confirm2('Reset all checkboxes? Topics, subtopics, notes, and LC links stay.', ()=>{
    checks={}; ps(K.chk,checks); render();
  });
}
function resetAll(){
  confirm2('Reset EVERYTHING? All custom topics, notes, LC links, and progress will be permanently wiped.', ()=>{
    appData=JSON.parse(JSON.stringify(DEFAULT_DATA));
    checks={}; openMap={}; metaMap={}; noteOpen={};
    addSubOpen=null; addTopicPhase=null;
    ps(K.data,appData); ps(K.chk,checks); ps(K.open,openMap); ps(K.meta,metaMap);
    render();
  });
}

// ═══════════════════════════════════════════════════
// RENDER (ROADMAP)
// ═══════════════════════════════════════════════════
function render(){
  const app=document.getElementById('app');
  let totalSubs=0, doneSubs=0, totalTopics=0;
  let html='';

  appData.forEach((phase,phIdx)=>{
    totalTopics+=phase.topics.length;
    html+=`<div class="phase">
      <div class="phase-header">
        <span class="phase-badge" style="background:${phase.color}22;color:${phase.color};border:1px solid ${phase.color}44">${esc(phase.phase)}</span>
        <span class="phase-title">${esc(phase.title)}</span>
        <button class="btn-add-topic" onclick="showAddTopic(${phIdx},event)">＋ Add Topic</button>
      </div>`;

    phase.topics.forEach((topic,order)=>{
      const n=topic.subs.length;
      const done=topic.subs.filter((_,i)=>isDone(topic.id,i)).length;
      const all=n>0&&done===n, part=done>0&&done<n;
      const open=!!openMap[topic.id];
      const cbCls=all?'checked':part?'partial':'';
      totalSubs+=n; doneSubs+=done;

      html+=`<div class="topic">
        <div class="topic-header" onclick="toggleOpen('${topic.id}')">
          <span class="topic-num">${String(order+1).padStart(2,'0')}</span>
          <div class="topic-checkbox ${cbCls}" onclick="toggleTopicBulk('${topic.id}',${n},event)"></div>
          <span class="topic-name${all?' done':''}">${esc(topic.name)}</span>
          <span class="topic-progress">${done}/${n}</span>
          <div class="topic-actions">
            <button class="icon-btn add-sub" title="Add subtopic" onclick="showAddSub('${topic.id}',event)">＋</button>
            <button class="icon-btn del" title="Delete topic" onclick="event.stopPropagation();deleteTopic('${topic.id}','${esc(topic.name)}')">✕</button>
          </div>
          <span class="toggle-icon${open?' open':''}">▶</span>
        </div>
        <div class="subtopics${open?' open':''}">`;

      topic.subs.forEach((sub,i)=>{
        const sd=isDone(topic.id,i);
        const nk=topic.id+'_'+i;
        const isNoteOpen=!!noteOpen[nk];
        const m=getMeta(topic.id,i);
        const hasContent=m.note||m.lc.length>0;
        const safeRaw=sub.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

        let chipsHtml='';
        if(m.lc.length){
          chipsHtml=`<div class="lc-chips">`;
          m.lc.forEach(lcid=>{
            chipsHtml+=`<a class="lc-chip" href="https://leetcode.com/problems/" target="_blank" onclick="event.stopPropagation()" title="LC #${lcid}">
              #${lcid}
              <span class="chip-x" onclick="removeLC('${topic.id}',${i},'${lcid}',event)">✕</span>
            </a>`;
          });
          chipsHtml+=`</div>`;
        }

        html+=`<div class="subtopic-wrap">
          <div class="subtopic-row">
            <div class="sub-left" onclick="toggleSub('${topic.id}',${i})">
              <div class="sub-cb${sd?' checked':''}"></div>
              <span class="sub-label${sd?' done':''}">${formatSub(sub)}</span>
            </div>
            <div class="sub-actions">
              <button class="sub-icon note-btn${hasContent?' active':''}" title="${isNoteOpen?'Close':'Add note / LC'}" onclick="toggleNote('${topic.id}',${i},event)">${isNoteOpen?'▲':'📝'}</button>
              <button class="sub-icon del" title="Remove subtopic" onclick="deleteSub('${topic.id}',${i},'${safeRaw}')">✕</button>
            </div>
          </div>

          <div class="sub-meta${isNoteOpen?' open':''}">
            ${chipsHtml}
            <div class="meta-row">
              <span class="lc-tag">LC #</span>
              <div class="lc-input-wrap">
                <input class="meta-input" id="lcinput_${topic.id}_${i}" type="text" placeholder="Problem number or URL, press Enter"
                  style="max-width:260px"
                  onkeydown="if(event.key==='Enter'){addLC('${topic.id}',${i});event.preventDefault();}"
                  onclick="event.stopPropagation()">
                <button class="form-btn" style="padding:5px 10px;font-size:0.7rem" onclick="addLC('${topic.id}',${i})">Add</button>
              </div>
            </div>
            <div class="meta-row">
              <textarea class="meta-input" id="note_${topic.id}_${i}" rows="2"
                placeholder="Your notes, key insight, pattern to remember…"
                onclick="event.stopPropagation()"
                onblur="saveNote('${topic.id}',${i})"
                onkeyup="saveNote('${topic.id}',${i})">${esc(m.note)}</textarea>
            </div>
            ${m.note?`<div class="note-saved" id="noteprev_${topic.id}_${i}">✓ saved</div>`:''}
          </div>
        </div>`;
      });

      if(addSubOpen===topic.id){
        html+=`<div class="add-sub-row">
          <input class="form-input" id="nsi_${topic.id}" type="text" placeholder="Subtopic — description (Enter to add)"
            onkeydown="if(event.key==='Enter')confirmAddSub('${topic.id}');else if(event.key==='Escape')cancelAddSub()">
          <button class="form-btn" onclick="confirmAddSub('${topic.id}')">Add</button>
          <button class="form-btn cancel" onclick="cancelAddSub()">Cancel</button>
        </div>`;
      }

      html+=`</div></div>`;
    });

    if(addTopicPhase===phIdx){
      html+=`<div class="add-topic-form">
        <input class="form-input topic-inp" id="newTopicInput" type="text" placeholder="New topic name (Enter to add)"
          onkeydown="if(event.key==='Enter')confirmAddTopic();else if(event.key==='Escape')cancelAddTopic()">
        <button class="form-btn" onclick="confirmAddTopic()">Add</button>
        <button class="form-btn cancel" onclick="cancelAddTopic()">Cancel</button>
      </div>`;
    }

    html+=`</div>`;
  });

  app.innerHTML=html;

  const pct=totalSubs?Math.round(doneSubs/totalSubs*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=`${doneSubs} / ${totalSubs} subtopics completed (${pct}%)`;
  document.getElementById('topicCount').textContent=totalTopics;

  renderDeadline();
}

// GUIDE LOGIC
// ═══════════════════════════════════════════════════
const GUIDE_PHASES = ["All","Phase 1","Phase 2","Phase 3","Phase 4","Phase 5"];
let guideActivePhase = "All";
let guideSearchTerm = "";

function lcUrl(id){ return "https://leetcode.com/problems/"+id+"/"; }
function gesc(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }

function guideFilterAll(){
  guideSearchTerm = document.getElementById("guideSearch").value.toLowerCase();
  guideRenderContent();
}

function guideSetPhase(p){
  guideActivePhase = p;
  document.querySelectorAll(".gpf-btn").forEach(b=>b.classList.toggle("active", b.dataset.phase===p));
  guideRenderContent();
}

function guideRenderContent(){
  const cont = document.getElementById("guideContent");
  const rc = document.getElementById("guideResultCount");
  let html = "";
  let visibleSubs = 0;

  GUIDE_DATA.forEach(block => {
    if(guideActivePhase !== "All" && block.phase !== guideActivePhase) return;

    let matchedSubs = block.subs.filter(sub => {
      if(!guideSearchTerm) return true;
      return sub.name.toLowerCase().includes(guideSearchTerm) ||
        sub.identify.toLowerCase().includes(guideSearchTerm) ||
        sub.keywords.some(k=>k.toLowerCase().includes(guideSearchTerm)) ||
        sub.lc.some(q=>q.n.toLowerCase().includes(guideSearchTerm)||q.id.includes(guideSearchTerm));
    });

    if(matchedSubs.length === 0) return;
    visibleSubs += matchedSubs.length;

    html += `<div class="guide-topic-block">
      <div class="guide-topic-title">
        ${gesc(block.topic)}
        <span class="guide-phase-pill" style="background:${block.phaseLight};color:${block.phaseColor}">${gesc(block.phase)}</span>
      </div>
      <div class="guide-topic-desc">💡 ${gesc(block.identify)}</div>`;

    matchedSubs.forEach(sub => {
      html += `<div class="guide-sub-card">
        <div class="guide-sub-name">${gesc(sub.name)}</div>
        <div class="guide-identify-label">How to identify</div>
        <div class="guide-identify-text">${gesc(sub.identify)}</div>
        <div class="guide-identify-label">Keywords to look for</div>
        <div class="guide-kw-wrap">${sub.keywords.map(k=>`<span class="guide-kw-tag">${gesc(k)}</span>`).join("")}</div>
        <div class="guide-identify-label">LeetCode problems</div>
        <div class="guide-lc-chips">${sub.lc.map(q=>`<a class="guide-lc-chip ${q.d}" href="${lcUrl(q.id)}" target="_blank" rel="noopener">${gesc(q.n)}</a>`).join("")}</div>
      </div>`;
    });

    html += `</div><hr class="guide-divider">`;
  });

  if(!html){
    html = `<div class="guide-no-results">No subtopics match your search.</div>`;
    rc.textContent = "";
  } else {
    rc.textContent = `Showing ${visibleSubs} subtopic${visibleSubs!==1?"s":""}`;
  }

  cont.innerHTML = html;
}

function initGuide(){
  const pf = document.getElementById("guidePhaseFilter");
  GUIDE_PHASES.forEach(p=>{
    const b = document.createElement("button");
    b.className = "gpf-btn" + (p==="All"?" active":"");
    b.dataset.phase = p;
    b.textContent = p;
    b.onclick = ()=>guideSetPhase(p);
    pf.appendChild(b);
  });
  guideRenderContent();
}
