space' font-size='7' font-weight='bold' fill='%234fffb0' text-anchor='middle' dominant-baseline='central' x='32' y='30'%3EDSA%3C/text%3E%3C/svg%3E">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0b0d11;
  --surface: #12151c;
  --surface2: #161a24;
  --border: #1e2330;
  --accent: #4fffb0;
  --accent2: #7b61ff;
  --text: #dde3f0;
  --muted: #5a6280;
  --danger: #ff5c5c;
  --warn: #ffa94d;
  --lc: #ffa116;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  padding: 32px 20px 120px;
}

/* ── HEADER ── */
header { text-align: center; margin-bottom: 32px; }
header h1 {
  font-size: clamp(1.8rem, 5vw, 3.2rem);
  font-weight: 800;
  letter-spacing: -1px;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; line-height: 1.1;
}
header p { margin-top: 8px; color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.8rem; letter-spacing: 1px; }

/* ── PROGRESS BAR ── */
.prog-wrap { max-width: 600px; margin: 16px auto 0; background: var(--border); border-radius: 999px; height: 6px; overflow: hidden; }
.prog-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); border-radius: 999px; transition: width 0.4s ease; width: 0%; }
.prog-label { text-align: center; margin-top: 6px; font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--muted); }

/* ── DEADLINE BANNER ── */
.deadline-banner {
  max-width: 860px; margin: 0 auto 32px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 18px 22px;
}
.deadline-banner.has-date { border-color: rgba(79,255,176,0.2); }
.deadline-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.deadline-label { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); letter-spacing: 1px; text-transform: uppercase; }
.deadline-input {
  background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem; padding: 6px 10px; outline: none; transition: border-color 0.15s;
}
.deadline-input:focus { border-color: var(--accent); }
.dl-clear { background: transparent; border: none; color: var(--muted); font-size: 0.75rem; cursor: pointer; font-family: 'JetBrains Mono', monospace; padding: 4px 6px; border-radius: 4px; }
.dl-clear:hover { color: var(--danger); }

.pacing-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 12px; margin-top: 16px;
}
.pacing-card {
  background: var(--surface2); border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px;
}
.pacing-card .pc-val {
  font-size: 1.6rem; font-weight: 800; line-height: 1;
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
}
.pacing-card .pc-val.warn { background: none; -webkit-text-fill-color: var(--warn); color: var(--warn); }
.pacing-card .pc-val.danger { background: none; -webkit-text-fill-color: var(--danger); color: var(--danger); }
.pacing-card .pc-lbl { font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; color: var(--muted); margin-top: 4px; letter-spacing: 0.5px; }
.week-bar-wrap { margin-top: 10px; background: var(--border); border-radius: 999px; height: 4px; overflow: hidden; }
.week-bar-fill { height: 100%; border-radius: 999px; transition: width 0.4s; }

/* ── CONTAINER ── */
.container { max-width: 860px; margin: 0 auto; }

/* ── PHASE ── */
.phase { margin-bottom: 40px; }
.phase-header {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 14px; padding-bottom: 12px; border-bottom: 1px solid var(--border);
}
.phase-badge {
  font-family: 'JetBrains Mono', monospace; font-size: 0.67rem; font-weight: 700;
  letter-spacing: 2px; padding: 4px 10px; border-radius: 4px; text-transform: uppercase; flex-shrink: 0;
}
.phase-title { font-size: 1.15rem; font-weight: 800; flex: 1; }
.btn-add-topic {
  font-family: 'JetBrains Mono', monospace; font-size: 0.7rem;
  color: var(--accent); background: rgba(79,255,176,0.07);
  border: 1px solid rgba(79,255,176,0.2); border-radius: 6px;
  padding: 5px 10px; cursor: pointer; transition: all 0.15s; white-space: nowrap;
}
.btn-add-topic:hover { background: rgba(79,255,176,0.15); border-color: var(--accent); }

/* ── TOPIC ── */
.topic { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 10px; overflow: hidden; transition: border-color 0.2s; }
.topic:hover { border-color: #252c40; }
.topic-header { display: flex; align-items: center; gap: 10px; padding: 13px 15px; cursor: pointer; user-select: none; }
.topic-header:hover { background: rgba(255,255,255,0.015); }
.topic-num { font-family: 'JetBrains Mono', monospace; font-size: 0.67rem; color: var(--muted); width: 22px; flex-shrink: 0; }
.topic-checkbox { width: 17px; height: 17px; border: 2px solid var(--muted); border-radius: 4px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; transition: all 0.15s; cursor: pointer; }
.topic-checkbox.checked { background: var(--accent); border-color: var(--accent); }
.topic-checkbox.checked::after { content: '✓'; font-size: 10px; color: #000; font-weight: 700; }
.topic-checkbox.partial { background: rgba(79,255,176,0.18); border-color: var(--accent); }
.topic-checkbox.partial::after { content: '–'; font-size: 13px; color: var(--accent); font-weight: 700; }
.topic-name { font-size: 0.92rem; font-weight: 700; flex: 1; min-width: 0; }
.topic-name.done { text-decoration: line-through; color: var(--muted); }
.topic-progress { font-family: 'JetBrains Mono', monospace; font-size: 0.68rem; color: var(--muted); white-space: nowrap; }
.topic-actions { display: flex; align-items: center; gap: 2px; flex-shrink: 0; }
.icon-btn { width: 26px; height: 26px; border-radius: 6px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.88rem; transition: all 0.15s; color: var(--muted); }
.icon-btn:hover { background: rgba(255,255,255,0.06); }
.icon-btn.add-sub { color: var(--accent); font-size: 1rem; }
.icon-btn.add-sub:hover { background: rgba(79,255,176,0.12); }
.icon-btn.del:hover { background: rgba(255,92,92,0.15); color: var(--danger); }
.toggle-icon { font-size: 0.7rem; color: var(--muted); transition: transform 0.2s; flex-shrink: 0; }
.toggle-icon.open { transform: rotate(90deg); }

/* ── SUBTOPICS PANEL ── */
.subtopics { display: none; border-top: 1px solid var(--border); background: rgba(0,0,0,0.12); }
.subtopics.open { display: block; }

/* ── SUBTOPIC ROW ── */
.subtopic-wrap { border-bottom: 1px solid rgba(30,35,48,0.5); }
.subtopic-wrap:last-child { border-bottom: none; }

.subtopic-row {
  display: flex; align-items: flex-start; gap: 8px;
  padding: 8px 15px 8px 50px;
}
.sub-left { display: flex; align-items: flex-start; gap: 8px; flex: 1; cursor: pointer; }
.sub-left:hover .sub-cb { border-color: var(--accent); }
.sub-cb { width: 14px; height: 14px; border: 1.5px solid var(--muted); border-radius: 3px; flex-shrink: 0; margin-top: 3px; display: flex; align-items: center; justify-content: center; transition: all 0.15s; }
.sub-cb.checked { background: var(--accent); border-color: var(--accent); }
.sub-cb.checked::after { content: '✓'; font-size: 8px; color: #000; font-weight: 700; }
.sub-label { font-size: 0.83rem; color: var(--text); line-height: 1.5; }
.sub-label strong { color: var(--accent); font-weight: 700; }
.sub-label.done { text-decoration: line-through; color: var(--muted); }
.sub-label.done strong { color: var(--muted); }

.sub-actions { display: flex; align-items: center; gap: 3px; flex-shrink: 0; margin-top: 1px; }
.sub-icon { width: 22px; height: 22px; border-radius: 5px; border: none; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 0.75rem; color: var(--muted); transition: all 0.15s; opacity: 0; }
.subtopic-wrap:hover .sub-icon { opacity: 1; }
.sub-icon:hover { background: rgba(255,255,255,0.07); color: var(--text); }
.sub-icon.del:hover { background: rgba(255,92,92,0.15); color: var(--danger); }
.sub-icon.note-btn { font-size: 0.7rem; }
.sub-icon.note-btn.active { opacity: 1; color: var(--accent2); }

/* ── NOTES + LC PANEL ── */
.sub-meta {
  display: none;
  padding: 0 15px 10px 50px;
  gap: 8px;
  flex-direction: column;
  background: rgba(0,0,0,0.1);
}
.sub-meta.open { display: flex; }

.meta-row { display: flex; gap: 8px; align-items: flex-start; }

.meta-input {
  flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem; padding: 7px 10px; outline: none; transition: border-color 0.15s;
  resize: none;
}
.meta-input:focus { border-color: var(--accent2); }
.meta-input::placeholder { color: var(--muted); }

.lc-input-wrap { display: flex; gap: 6px; align-items: center; flex: 1; }
.lc-tag {
  font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
  color: var(--lc); background: rgba(255,161,22,0.1);
  border: 1px solid rgba(255,161,22,0.25); border-radius: 4px;
  padding: 3px 7px; white-space: nowrap; flex-shrink: 0;
}

/* LC chips */
.lc-chips { display: flex; flex-wrap: wrap; gap: 5px; padding: 4px 0 2px; }
.lc-chip {
  display: flex; align-items: center; gap: 4px;
  font-family: 'JetBrains Mono', monospace; font-size: 0.65rem;
  color: var(--lc); background: rgba(255,161,22,0.08);
  border: 1px solid rgba(255,161,22,0.2); border-radius: 5px;
  padding: 3px 7px; text-decoration: none; cursor: pointer;
  transition: all 0.12s;
}
.lc-chip:hover { background: rgba(255,161,22,0.18); border-color: var(--lc); }
.lc-chip .chip-x { color: var(--muted); font-size: 0.6rem; }
.lc-chip .chip-x:hover { color: var(--danger); }

.note-saved { font-family: 'JetBrains Mono', monospace; font-size: 0.64rem; color: var(--muted); font-style: italic; }
.note-preview { font-family: 'JetBrains Mono', monospace; font-size: 0.7rem; color: var(--muted); padding: 3px 0 4px; line-height: 1.4; white-space: pre-wrap; }

/* ── ADD FORMS ── */
.add-sub-row { display: flex; gap: 7px; padding: 10px 15px 8px 50px; align-items: center; border-top: 1px solid var(--border); background: rgba(0,0,0,0.1); }
.add-topic-form { background: var(--surface); border: 1px dashed rgba(79,255,176,0.3); border-radius: 12px; padding: 13px 15px; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; }

.form-input {
  flex: 1; background: rgba(255,255,255,0.04); border: 1px solid var(--border);
  border-radius: 7px; color: var(--text); font-family: 'JetBrains Mono', monospace;
  font-size: 0.78rem; padding: 7px 11px; outline: none; transition: border-color 0.15s;
}
.form-input.topic-inp { font-family: 'Syne', sans-serif; font-size: 0.88rem; font-weight: 700; }
.form-input:focus { border-color: var(--accent); }
.form-input::placeholder { color: var(--muted); font-weight: 400; font-family: 'JetBrains Mono', monospace; }

.form-btn { background: rgba(79,255,176,0.1); border: 1px solid rgba(79,255,176,0.3); border-radius: 7px; color: var(--accent); font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; padding: 7px 12px; cursor: pointer; transition: all 0.15s; white-space: nowrap; }
.form-btn:hover { background: rgba(79,255,176,0.2); }
.form-btn.cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.form-btn.cancel:hover { border-color: var(--danger); color: var(--danger); background: transparent; }

/* ── BOTTOM ── */
.bottom-actions { display: flex; justify-content: center; gap: 12px; margin-top: 32px; flex-wrap: wrap; }
.bottom-btn { background: transparent; border: 1px solid var(--border); color: var(--muted); font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; padding: 8px 18px; border-radius: 7px; cursor: pointer; transition: all 0.15s; }
.bottom-btn:hover { border-color: var(--danger); color: var(--danger); }

/* ── MODAL ── */
.modal-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100; align-items: center; justify-content: center; }
.modal-overlay.open { display: flex; }
.modal { background: #181c28; border: 1px solid var(--border); border-radius: 14px; padding: 26px 22px; max-width: 400px; width: 90%; }
.modal h3 { font-size: 0.92rem; margin-bottom: 18px; line-height: 1.5; }
.modal-actions { display: flex; gap: 8px; justify-content: flex-end; }
.modal-actions button { font-family: 'JetBrains Mono', monospace; font-size: 0.76rem; padding: 7px 15px; border-radius: 7px; cursor: pointer; transition: all 0.15s; }
.modal-confirm { background: rgba(255,92,92,0.12); border: 1px solid rgba(255,92,92,0.4); color: var(--danger); }
.modal-confirm:hover { background: rgba(255,92,92,0.22); }
.modal-cancel { background: transparent; border: 1px solid var(--border); color: var(--muted); }
.modal-cancel:hover { color: var(--text); border-color: var(--muted); }

/* ── GITHUB BADGE ── */
.gh-badge {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: flex;
  align-items: center;
  gap: 8px;
  background: #12151c;
  border: 1px solid #2a3050;
  border-radius: 10px;
  padding: 9px 14px;
  text-decoration: none;
  color: var(--text);
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  z-index: 50;
  transition: border-color 0.2s, background 0.2s, transform 0.15s;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
.gh-badge:hover {
  border-color: var(--accent);
  background: #1a1f2e;
  transform: translateY(-2px);
}
.gh-badge svg { flex-shrink: 0; }
.gh-badge .gh-name { color: var(--accent); font-weight: 700; letter-spacing: 0.5px; }

@media (max-width: 580px) {
  .topic-num { display: none; }
  .subtopic-row { padding-left: 32px; }
  .sub-meta { padding-left: 32px; }
  .add-sub-row { padding-left: 32px; }
  .gh-badge { bottom: 16px; right: 16px; padding: 7px 11px; }
}
</style>
</head>
<body>

<header>
  <h1>DSA Roadmap</h1>
  <p>// track your progress · <span id="topicCount">30</span> topics</p>
  <div class="prog-wrap"><div class="prog-fill" id="progressFill"></div></div>
  <div class="prog-label" id="progressLabel">0 / 0 subtopics completed</div>
</header>

<!-- DEADLINE BANNER -->
<div class="deadline-banner" id="deadlineBanner">
  <div class="deadline-top">
    <span class="deadline-label">🎯 Target Date</span>
    <input type="date" class="deadline-input" id="deadlineInput" onchange="setDeadline(this.value)">
    <button class="dl-clear" id="dlClear" onclick="clearDeadline()" style="display:none">✕ Clear</button>
  </div>
  <div id="pacingGrid" style="display:none" class="pacing-grid"></div>
</div>

<div class="container" id="app"></div>

<div class="bottom-actions">
  <button class="bottom-btn" onclick="resetProgress()">↺ Reset Progress Only</button>
  <button class="bottom-btn" onclick="resetAll()">⚠ Reset Everything</button>
</div>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalMsg">Are you sure?</h3>
    <div class="modal-actions">
      <button class="modal-cancel" onclick="closeModal()">Cancel</button>
      <button class="modal-confirm" id="modalConfirmBtn">Confirm</button>
    </div>
  </div>
</div>

<!-- GitHub Badge -->

<script>
// ═══════════════════════════════════════════════════
// DEFAULT DATA
// ═══════════════════════════════════════════════════
const DEFAULT_DATA = [
  { phase:"PHASE 1", title:"Foundations", color:"#ff6b6b", topics:[
    { id:"t1", name:"Arrays & Strings", subs:["Static vs Dynamic Arrays — fixed-size vs resizable arrays, memory layout, cache efficiency","In-place operations — modifying array without extra space (reversal, rotation)","Kadane's Algorithm — max subarray sum in O(n) using local/global max tracking","Dutch National Flag — 3-way partition for 0s, 1s, 2s in one pass","Array Rotation — left/right rotation using reversal trick in O(n)","String immutability — why strings behave differently from arrays in Java/Python","Character frequency — using arrays of size 26 instead of hashmaps for lowercase strings","Anagram & palindrome checks — sorting vs frequency counting approaches","String matching (naive) — brute force O(n×m) before learning KMP later"]},

// PERSISTENCE
// ═══════════════════════════════════════════════════
const K = { data:'dsa_data_v4', chk:'dsa_chk_v4', open:'dsa_open_v4', meta:'dsa_meta_v4', dl:'dsa_deadline_v4' };
function ps(key,val){ try{ localStorage.setItem(key, JSON.stringify(val)); }catch{} }
function ld(key,def){ try{ const r=localStorage.getItem(key); return r?JSON.parse(r):def; }catch{ return def; } }

let appData  = ld(K.data, JSON.parse(JSON.stringify(DEFAULT_DATA)));
let checks   = ld(K.chk,  {});
let openMap  = ld(K.open, {});
// meta[tid][subIdx] = { note: '', lc: ['123','456'] }
let metaMap  = ld(K.meta, {});
let deadline = ld(K.dl,   null);

let addSubOpen=null, addTopicPhase=null, noteOpen={};
let idSeq=Date.now();
function genId(){ return 'u'+(++idSeq); }

// ═══════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function subKey(tid,i){ return tid+':'+i; }
function metaKey(tid,i){ return tid+'__'+i; }

function findTopic(tid){
  for(const ph of appData){ const t=ph.topics.find(x=>x.id===tid); if(t) return t; }
  return null;
}

function getMeta(tid,i){
  const k=metaKey(tid,i);
  if(!metaMap[k]) metaMap[k]={note:'',lc:[]};
  return metaMap[k];
}

function formatSub(text){
  const d=text.indexOf(' — ');
  if(d===-1) return esc(text);
  return `<strong>${esc(text.slice(0,d))}</strong> — ${esc(text.slice(d+3))}`;
}

function countSubsTotal(){
  let t=0; for(const ph of appData) for(const tp of ph.topics) t+=tp.subs.length; return t;
}
function countSubsDone(){
  let d=0;
  for(const ph of appData) for(const tp of ph.topics) tp.subs.forEach((_,i)=>{ if(isDone(tp.id,i)) d++; });
  return d;
}

// ═══════════════════════════════════════════════════
// DEADLINE + PACING
// ═══════════════════════════════════════════════════
function setDeadline(val){
  deadline = val || null;
  ps(K.dl, deadline);
  renderDeadline();
}
function clearDeadline(){
  deadline=null; ps(K.dl,null);
  document.getElementById('deadlineInput').value='';
  renderDeadline();
}

function renderDeadline(){
  const banner  = document.getElementById('deadlineBanner');
  const grid    = document.getElementById('pacingGrid');
  const dlClear = document.getElementById('dlClear');
  const dlInput = document.getElementById('deadlineInput');

  if(deadline) dlInput.value = deadline;

  if(!deadline){
    banner.classList.remove('has-date');
    grid.style.display='none';
    dlClear.style.display='none';
    return;
  }

  banner.classList.add('has-date');
  dlClear.style.display='inline-block';

  const today   = new Date(); today.setHours(0,0,0,0);
  const target  = new Date(deadline); target.setHours(0,0,0,0);
  const msDay   = 86400000;
  const daysLeft= Math.ceil((target-today)/msDay);
  const weeksLeft=Math.max(0,(daysLeft/7));

  const totalSubs = countSubsTotal();
  const doneSubs  = countSubsDone();
  const remaining = totalSubs - doneSubs;
  const subsPerWeek = weeksLeft > 0 ? (remaining/weeksLeft).toFixed(1) : '∞';
  const subsPerDay  = daysLeft  > 0 ? (remaining/daysLeft).toFixed(1)  : '∞';

  const pct = totalSubs ? Math.round(doneSubs/totalSubs*100) : 0;
  const urgency = daysLeft < 14 ? 'danger' : daysLeft < 30 ? 'warn' : '';

  grid.style.display='grid';
  grid.innerHTML = `
    <div class="pacing-card">
      <div class="pc-val ${urgency}">${daysLeft<0?'0':daysLeft}</div>
      <div class="pc-lbl">days remaining</div>
    </div>
    <div class="pacing-card">
      <div class="pc-val">${remaining}</div>
      <div class="pc-lbl">subtopics left</div>
    </div>
    <div class="pacing-card">
      <div class="pc-val ${parseFloat(subsPerWeek)>10?'warn':''}">${subsPerWeek}</div>
      <div class="pc-lbl">subtopics / week needed</div>
    </div>
    <div class="pacing-card">
      <div class="pc-val ${parseFloat(subsPerDay)>3?'warn':''}">${subsPerDay}</div>
      <div class="pc-lbl">subtopics / day needed</div>
    </div>
    <div class="pacing-card" style="grid-column:1/-1">
      <div class="pc-lbl" style="margin-bottom:6px">Overall Progress — ${pct}% complete</div>
      <div class="week-bar-wrap">
        <div class="week-bar-fill" style="width:${pct}%;background:linear-gradient(90deg,var(--accent),var(--accent2))"></div>
      </div>
    </div>
  `;
}

// ═══════════════════════════════════════════════════
// CHECKS
// ═══════════════════════════════════════════════════
function isDone(tid,i){ return !!checks[subKey(tid,i)]; }

function toggleSub(tid,i){
  checks[subKey(tid,i)]=!checks[subKey(tid,i)];
  ps(K.chk,checks); render();
}
function toggleTopicBulk(tid,n,e){
  e.stopPropagation();
  const t=findTopic(tid); if(!t) return;
  const all=t.subs.every((_,i)=>isDone(tid,i));
  t.subs.forEach((_,i)=>{ checks[subKey(tid,i)]=!all; });
  ps(K.chk,checks); render();
}

// ═══════════════════════════════════════════════════
// OPEN/CLOSE
// ═══════════════════════════════════════════════════
function toggleOpen(tid){
  openMap[tid]=!openMap[tid];
  ps(K.open,openMap); render();
}

// ═══════════════════════════════════════════════════
// NOTES & LC
// ═══════════════════════════════════════════════════
function toggleNote(tid,i,e){
  e.stopPropagation();
  const k=tid+'_'+i;
  noteOpen[k]=!noteOpen[k];
  render();
  if(noteOpen[k]){
    setTimeout(()=>{ const el=document.getElementById('note_'+tid+'_'+i); if(el) el.focus(); },40);
  }
}

function saveNote(tid,i){
  const el=document.getElementById('note_'+tid+'_'+i);
  if(!el) return;
  getMeta(tid,i).note=el.value;
  ps(K.meta,metaMap);
  // update preview without full render
  const prev=document.getElementById('noteprev_'+tid+'_'+i);
  if(prev) prev.textContent=el.value;
}

function addLC(tid,i){
  const el=document.getElementById('lcinput_'+tid+'_'+i);
  if(!el) return;
  const raw=el.value.trim();
  if(!raw) return;
  // accept number or full URL
  const num = raw.match(/(\d{1,5})/);
  if(!num){ el.value=''; return; }
  const id=num[1];
  const m=getMeta(tid,i);
  if(!m.lc.includes(id)) m.lc.push(id);
  ps(K.meta,metaMap);
  el.value='';
  render();
}

function removeLC(tid,i,lcid,e){
  e.stopPropagation();
  const m=getMeta(tid,i);
  m.lc=m.lc.filter(x=>x!==lcid);
  ps(K.meta,metaMap);
  render();
}

// ═══════════════════════════════════════════════════
// ADD / REMOVE TOPIC
// ═══════════════════════════════════════════════════
function showAddTopic(phIdx,e){
  e.stopPropagation(); addTopicPhase=phIdx; addSubOpen=null;
  render();
  setTimeout(()=>{ const el=document.getElementById('newTopicInput'); if(el) el.focus(); },40);
}
function cancelAddTopic(){ addTopicPhase=null; render(); }
function confirmAddTopic(){
  const el=document.getElementById('newTopicInput');
  const name=el?el.value.trim():'';
  if(!name){ if(el) el.focus(); return; }
  const id=genId();
  appData[addTopicPhase].topics.push({id,name,subs:[]});
  openMap[id]=true; addTopicPhase=null;
  ps(K.data,appData); ps(K.open,openMap); render();
}
function deleteTopic(tid,tname){
  confirm2(`Delete topic "${tname}"? All subtopics, notes, and progress will be lost.`, ()=>{
    for(const ph of appData){
      const idx=ph.topics.findIndex(t=>t.id===tid);
      if(idx!==-1){
        const t=ph.topics[idx];
        t.subs.forEach((_,i)=>{ delete checks[subKey(tid,i)]; delete metaMap[metaKey(tid,i)]; });
        ph.topics.splice(idx,1); break;
      }
    }
    ps(K.data,appData); ps(K.chk,checks); ps(K.meta,metaMap); render();
  });
}

// ═══════════════════════════════════════════════════
// ADD / REMOVE SUBTOPIC
// ═══════════════════════════════════════════════════
function showAddSub(tid,e){
  e.stopPropagation(); addSubOpen=tid; addTopicPhase=null;
  openMap[tid]=true; ps(K.open,openMap); render();
  setTimeout(()=>{ const el=document.getElementById('nsi_'+tid); if(el) el.focus(); },40);
}
function cancelAddSub(){ addSubOpen=null; render(); }
function confirmAddSub(tid){
  const el=document.getElementById('nsi_'+tid);
  const text=el?el.value.trim():'';
  if(!text){ if(el) el.focus(); return; }
  const t=findTopic(tid); if(!t) return;
  t.subs.push(text); addSubOpen=null;
  ps(K.data,appData); render();
}
function deleteSub(tid,idx,raw){
  const label=raw.length>55?raw.slice(0,55)+'…':raw;
  confirm2(`Remove subtopic: "${label}"?`, ()=>{
    const t=findTopic(tid); if(!t) return;
    for(let i=idx;i<t.subs.length-1;i++){
      checks[subKey(tid,i)]=checks[subKey(tid,i+1)];
      metaMap[metaKey(tid,i)]=metaMap[metaKey(tid,i+1)];
    }
    delete checks[subKey(tid,t.subs.length-1)];
    delete metaMap[metaKey(tid,t.subs.length-1)];
    t.subs.splice(idx,1);
    ps(K.data,appData); ps(K.chk,checks); ps(K.meta,metaMap); render();
  });
}

}

    checks={}; openMap={}; metaMap={}; noteOpen={};

// ═══════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════
function render(){
  const app=document.getElementById('app');
  let totalSubs=0, doneSubs=0, totalTopics=0;
  let html='';

  appData.forEach((phase,phIdx)=>{
    totalTopics+=phase.topics.length;
    html+=`<div class="phase">
      <div class="phase-header">
        <span class="phase-badge" style="background:${phase.color}22;color:${phase.color};border:1px solid ${phase.color}44">${esc(phase.phase)}</span>
        <span class="phase-title">${esc(phase.title)}</span>
        <button class="btn-add-topic" onclick="showAddTopic(${phIdx},event)">＋ Add Topic</button>
      </div>`;

    phase.topics.forEach((topic,order)=>{
      const n=topic.subs.length;
      const done=topic.subs.filter((_,i)=>isDone(topic.id,i)).length;
      const all=n>0&&done===n, part=done>0&&done<n;
      const open=!!openMap[topic.id];
      const cbCls=all?'checked':part?'partial':'';
      totalSubs+=n; doneSubs+=done;

      html+=`<div class="topic">
        <div class="topic-header" onclick="toggleOpen('${topic.id}')">
          <span class="topic-num">${String(order+1).padStart(2,'0')}</span>
          <div class="topic-checkbox ${cbCls}" onclick="toggleTopicBulk('${topic.id}',${n},event)"></div>
          <span class="topic-name${all?' done':''}">${esc(topic.name)}</span>
          <span class="topic-progress">${done}/${n}</span>
          <div class="topic-actions">
            <button class="icon-btn add-sub" title="Add subtopic" onclick="showAddSub('${topic.id}',event)">＋</button>
            <button class="icon-btn del" title="Delete topic" onclick="event.stopPropagation();deleteTopic('${topic.id}','${esc(topic.name)}')">✕</button>
          </div>
          <span class="toggle-icon${open?' open':''}">▶</span>
        </div>
        <div class="subtopics${open?' open':''}">`;

      topic.subs.forEach((sub,i)=>{
        const sd=isDone(topic.id,i);
        const nk=topic.id+'_'+i;
        const isNoteOpen=!!noteOpen[nk];
        const m=getMeta(topic.id,i);
        const hasContent=m.note||m.lc.length>0;
        const safeRaw=sub.replace(/\\/g,'\\\\').replace(/'/g,"\\'");

        // LC chips html
        let chipsHtml='';
        if(m.lc.length){
          chipsHtml=`<div class="lc-chips">`;
          m.lc.forEach(lcid=>{
            chipsHtml+=`<a class="lc-chip" href="https://leetcode.com/problems/" target="_blank" onclick="event.stopPropagation()" title="LC #${lcid}">
              #${lcid}
              <span class="chip-x" onclick="removeLC('${topic.id}',${i},'${lcid}',event)">✕</span>
            </a>`;
          });
          chipsHtml+=`</div>`;
        }

        html+=`<div class="subtopic-wrap">
          <div class="subtopic-row">
            <div class="sub-left" onclick="toggleSub('${topic.id}',${i})">
              <div class="sub-cb${sd?' checked':''}"></div>
              <span class="sub-label${sd?' done':''}">${formatSub(sub)}</span>
            </div>
            <div class="sub-actions">
              <button class="sub-icon note-btn${hasContent?' active':''}" title="${isNoteOpen?'Close':'Add note / LC'}" onclick="toggleNote('${topic.id}',${i},event)">${isNoteOpen?'▲':'📝'}</button>
              <button class="sub-icon del" title="Remove subtopic" onclick="deleteSub('${topic.id}',${i},'${safeRaw}')">✕</button>
            </div>
          </div>

          <!-- NOTE + LC PANEL -->
          <div class="sub-meta${isNoteOpen?' open':''}">
            ${chipsHtml}
            <div class="meta-row">
              <span class="lc-tag">LC #</span>
              <div class="lc-input-wrap">
                <input class="meta-input" id="lcinput_${topic.id}_${i}" type="text" placeholder="Problem number or URL, press Enter"
                  style="max-width:260px"
                  onkeydown="if(event.key==='Enter'){addLC('${topic.id}',${i});event.preventDefault();}"
                  onclick="event.stopPropagation()">
                <button class="form-btn" style="padding:5px 10px;font-size:0.7rem" onclick="addLC('${topic.id}',${i})">Add</button>
              </div>
            </div>
            <div class="meta-row">
              <textarea class="meta-input" id="note_${topic.id}_${i}" rows="2"
                placeholder="Your notes, key insight, pattern to remember…"
                onclick="event.stopPropagation()"
                onblur="saveNote('${topic.id}',${i})"
                onkeyup="saveNote('${topic.id}',${i})">${esc(m.note)}</textarea>
            </div>
            ${m.note?`<div class="note-saved" id="noteprev_${topic.id}_${i}">✓ saved</div>`:''}
          </div>
        </div>`;
      });

      // add subtopic form
      if(addSubOpen===topic.id){
        html+=`<div class="add-sub-row">
          <input class="form-input" id="nsi_${topic.id}" type="text" placeholder="Subtopic — description (Enter to add)"
            onkeydown="if(event.key==='Enter')confirmAddSub('${topic.id}');else if(event.key==='Escape')cancelAddSub()">
          <button class="form-btn" onclick="confirmAddSub('${topic.id}')">Add</button>
          <button class="form-btn cancel" onclick="cancelAddSub()">Cancel</button>
        </div>`;
      }

      html+=`</div></div>`;
    });

    if(addTopicPhase===phIdx){
      html+=`<div class="add-topic-form">
        <input class="form-input topic-inp" id="newTopicInput" type="text" placeholder="New topic name (Enter to add)"
          onkeydown="if(event.key==='Enter')confirmAddTopic();else if(event.key==='Escape')cancelAddTopic()">
        <button class="form-btn" onclick="confirmAddTopic()">Add</button>
        <button class="form-btn cancel" onclick="cancelAddTopic()">Cancel</button>
      </div>`;
    }

    html+=`</div>`;
  });

  app.innerHTML=html;

  const pct=totalSubs?Math.round(doneSubs/totalSubs*100):0;
  document.getElementById('progressFill').style.width=pct+'%';
  document.getElementById('progressLabel').textContent=`${doneSubs} / ${totalSubs} subtopics completed (${pct}%)`;
  document.getElementById('topicCount').textContent=totalTopics;

  renderDeadline();
}

// ═══════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════
render();
</script>
